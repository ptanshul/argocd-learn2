apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deploy-azure-vm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ptanshul/argocd-learn2.git'
    targetRevision: master
    path: 'k8s/charts'
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true