apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deploy-azure-vm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-username/my-azure-gitops-repo.git'
    targetRevision: HEAD
    path: 'k8s/chart'              # Points to your Helm chart directory
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true